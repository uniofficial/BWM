spring.application.name=BWM

# 만료 경매 자동 마감 스케줄러
# 이전 실행 종료 후 다음 실행까지 60초 대기
auction.scheduler.fixed-delay=60000

# 서버 시작 후 첫 실행까지 10초 대기
auction.scheduler.initial-delay=10000

# OpenAPI JSON path
springdoc.api-docs.path=/v3/api-docs

# Swagger UI path
springdoc.swagger-ui.path=/swagger-ui.html

# Swagger UI settings
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
# data source
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306
spring.datasource.username=root
spring.datasource.password=pw

# session persistence
#server.servlet.session.persistent=false

## jpa
#spring.jpa.open-in-view=false
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true

# spring security debug logging
#logging.level.org.springframework.security=DEBUG

# 상품 이미지 로컬 저장 경로
file.upload-dir=uploads/items

# 업로드 용량 제한
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
